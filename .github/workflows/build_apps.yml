name: Build iOS IPA & Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    # macos-14 ships Xcode 15.4 (Swift 5.10), which can't compile the Swift 6
    # syntax used by newer FirebaseCoreInternal (bundled via firebase_core).
    # macos-15 ships Xcode 16+ with a Swift 6 compiler.
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # SPM integration for iOS plugins (e.g. cloud_firestore) hits a
      # rsync/mkdir race condition on macOS CI runners — the SourcePackages
      # folder isn't created in time before the copy starts. Falling back
      # to CocoaPods (the long-standing, CI-proven path) avoids it entirely.
      - name: Disable Swift Package Manager (avoid SPM rsync race on CI)
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: |
          flutter precache --ios
          flutter pub get

      - name: Build iOS App (.ipa unsigned for Sideload)
        run: |
          flutter build ios --release --no-codesign -v
          cd ios
          mkdir -p Payload
          mv ../build/ios/iphoneos/Runner.app Payload/
          zip -r AniVerse.ipa Payload
          mv AniVerse.ipa ../build/AniVerse.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniVerse-iOS-IPA
          path: build/AniVerse.ipa

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniVerse-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
