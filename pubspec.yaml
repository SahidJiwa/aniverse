name: aniverse
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  http: ^1.2.2
  youtube_player_flutter: ^9.1.1
  liquid_glass_widgets: ^0.21.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  permission_handler: ^11.3.1
  google_sign_in: ^6.2.1
  firebase_core: 3.6.0
  cloud_firestore: 5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "asset/logo aniverse.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - asset/
    - asset/images/
    - asset/images/collection/
    - asset/images/icon/
    - asset/images/home screen/
    - asset/images/vault/
    - assets/fonts/
    - assets/border/
    - assets/images/voice_actors/
  fonts:
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Regular.ttf
    - family: ShipporiMinchoB1
      fonts:
        - asset: assets/fonts/ShipporiMinchoB1-Regular.ttf
