<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aniverse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Sign-In OAuth Client ID (Web) — required by google_sign_in_web -->
  <meta name="google-signin-client_id" content="30870693875-vflc5tg0076ntfkv9aalbuq849dsfprb.apps.googleusercontent.com">

  <title>aniverse</title>
  <link rel="manifest" href="manifest.json">

  <!-- HLS.js (m3u8 playback on Flutter Web <video> — sub Indo streams) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script>
    // Attach an HLS (.m3u8) source to a <video> element using hls.js when
    // the browser can't play HLS natively (Chrome/Edge desktop). Safari/iOS
    // play HLS natively, so we fall back to the plain src there.
    window.__aniverseAttachHls = function (videoEl, url) {
      try {
        if (!videoEl) return;
        if (window.Hls && window.Hls.isSupported()) {
          var hls = new window.Hls({ enableWorker: true, lowLatencyMode: false });
          hls.loadSource(url);
          hls.attachMedia(videoEl);
          hls.on(window.Hls.Events.ERROR, function (evt, data) {
            if (data && data.fatal) { try { hls.destroy(); } catch (e) {} }
          });
          videoEl.__aniverseHls = hls;
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
          videoEl.src = url;
        }
      } catch (e) {}
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
